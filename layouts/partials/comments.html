<div id="waline"></div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.css" />
<script src="https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.umd.js"></script>

<script>
window.addEventListener('load', function () {
  // 确认#waline元素存在再初始化
  const walineEl = document.querySelector('#waline');
  if(walineEl){
    Waline.init({
      el: '#waline',
      serverURL: 'https://walinework.siai.pub',
	  meta: ['nick','mail'],
      requiredMeta: ['nick'],
      anonymous: true,
      lang: 'zh-CN',
      pageview: false,
      noRss: true,
      noCopyright: true,
      emoji: false
    });
  }
});
</script>
